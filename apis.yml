name: ScreenshotAPI
description: >-
  ScreenshotAPI (screenshotapi.to) is a hosted screenshot and PDF capture API — send a URL or raw
  HTML, get back a PNG, JPEG, WebP or PDF without running browser infrastructure. The contract is
  deliberately small: one screenshot resource answering both GET and POST, plus a health check.
  What sets it apart from its size is the agent-readable surface around it — an llms.txt on the
  root, a 302KB llms-full.txt, a separate docs llms.txt, an agent install guide, a dedicated
  AI-agents page, and per-page markdown by appending .md to any /docs/ URL. An MCP server exists
  but runs locally over stdio and is not yet published to npm, so it is described here rather than
  advertised as a hosted endpoint. Not to be confused with ScreenshotAPI.net, a different company
  in the same category — see the screenshotapi-net entry.
